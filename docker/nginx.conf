server {
    # Escuta na porta 80, que será exposta pelo Docker
    listen 80;
    # Aceita requisições para qualquer nome de host (adequado para o Render)
    server_name _;
    # Define o diretório raiz para a pasta public do Laravel dentro do container
    root /var/www/html/public;

    # Adiciona index.php à lista de arquivos padrão a serem procurados
    index index.php index.html;

    # Configuração para servir arquivos estáticos e direcionar o resto para o Laravel
    location / {
        # Tenta servir o arquivo diretamente, depois como diretório, depois passa para index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processa arquivos PHP usando PHP-FPM
    location ~ \.php$ {
        try_files $uri =404; # Garante que o arquivo PHP existe antes de passar

        # Passa a requisição para o PHP-FPM escutando em 127.0.0.1:9000 (padrão da imagem php:fpm)
        fastcgi_pass 127.0.0.1:9000;

        # Define o script de índice padrão
        fastcgi_index index.php;
        # Passa o nome do script PHP para o PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Inclui parâmetros FastCGI padrão
        include fastcgi_params;

        # Opcional: Aumentar timeouts se houver requisições longas
        # fastcgi_read_timeout 300;
    }

    # Bloqueia o acesso a arquivos ocultos (como .htaccess)
    location ~ /\.ht {
        deny all;
    }

    # Opcional: Configuração para logs (pode ser útil para depuração)
    # access_log /var/log/nginx/access.log;
    # error_log /var/log/nginx/error.log;
}
